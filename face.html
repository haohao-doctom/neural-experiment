<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园人脸识别签到</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body { background: #f0f4fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; width: 100%; background: white; border-radius: 48px; box-shadow: 0 20px 60px rgba(0,20,40,0.12); padding: 32px 36px 40px; }
        .back { display: inline-block; color: #2b7be4; text-decoration: none; font-size: 14px; margin-bottom: 16px; }
        .back:hover { text-decoration: underline; }
        .title { font-size: 24px; font-weight: 600; color: #0a2647; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
        .title small { font-weight: 400; font-size: 14px; color: #5f7d9c; }
        .subtitle { color: #5f7d9c; font-size: 14px; margin-bottom: 20px; }
        .input-area { background: #f9fbfe; border-radius: 20px; padding: 18px 16px 16px; margin-bottom: 16px; }
        .section-title { font-weight: 500; font-size: 15px; color: #0b2b4a; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: #2b7be4; }
        .btn { background: white; border: 1px solid #b6cee9; border-radius: 60px; padding: 8px 22px; font-weight: 500; font-size: 14px; color: #1c4b7a; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.15s; }
        .btn-primary { background: #1a5fb0; border-color: #1a5fb0; color: white; }
        .btn-primary:hover { background: #124a8a; transform: scale(0.97); }
        .btn-success { background: #1a8b4c; border-color: #1a8b4c; color: white; }
        .btn-success:hover { background: #0f6d3a; transform: scale(0.97); }
        .btn-warning { background: #d48c1a; border-color: #d48c1a; color: white; }
        .btn-warning:hover { background: #b0700f; transform: scale(0.97); }
        .btn-outline { background: transparent; border: 1px solid #b0c8e3; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 10px; margin-top: 6px; }
        .file-upload { background: white; border: 1px solid #ccdcee; border-radius: 60px; padding: 6px 18px 6px 14px; font-size: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1 1 160px; }
        .file-upload:hover { background: #edf4fe; }
        .file-upload input { display: none; }
        .training-log { background: #0a1a2f; color: #b0d4f0; border-radius: 16px; padding: 14px 18px; font-family: monospace; font-size: 13px; max-height: 150px; overflow-y: auto; margin-top: 10px; line-height: 1.7; }
        .training-log .ok { color: #7ddf9a; }
        .training-log .info { color: #8ab8e6; }
        .training-log .gold { color: #f7d44a; font-weight: bold; }
        .weight-bar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
        .weight-bar .track { flex: 1; height: 8px; background: #e2eaf3; border-radius: 10px; overflow: hidden; }
        .weight-bar .fill { height: 100%; background: linear-gradient(90deg, #2b7be4, #1a8b4c); border-radius: 10px; width: 5%; transition: width 0.3s; }
        .weight-display { background: #1a2a3f; border-radius: 12px; padding: 10px 16px; margin-top: 8px; font-family: monospace; font-size: 14px; color: #f7d44a; border-left: 3px solid #f7d44a; display: none; }
        .weight-display .label { color: #8ab8e6; font-size: 12px; }
        .photo-preview { display: flex; gap: 20px; margin: 10px 0; flex-wrap: wrap; }
        .photo-box { flex: 1; min-width: 100px; background: white; border-radius: 16px; padding: 12px; text-align: center; border: 2px dashed #ccdcee; }
        .photo-box img { max-width: 100%; height: auto; border-radius: 12px; max-height: 120px; }
        .photo-box .placeholder { color: #a0b8d0; font-size: 13px; padding: 16px 0; }
        .photo-box .label { font-size: 12px; color: #5f7d9c; display: block; margin-bottom: 4px; }
        .label-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .label-tag { background: #d4e2fc; color: #1a4c8a; padding: 2px 12px; border-radius: 30px; font-size: 12px; }
        .thumbnails { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .thumbnails img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; border: 1px solid #ccdcee; }
        .value-badge { background: #dfe9f5; padding: 2px 12px; border-radius: 30px; font-size: 13px; font-weight: 500; color: #00337a; min-width: 34px; text-align: center; }
        .result-tag { background: white; border-radius: 60px; padding: 10px 22px; font-weight: 600; font-size: 20px; display: inline-flex; align-items: center; gap: 10px; }
        .result-tag i { color: #1f6ed4; }
        .confidence { background: #e3edfa; padding: 6px 18px; border-radius: 60px; font-size: 15px; font-weight: 500; }
        .note { font-size: 13px; color: #4d6f91; margin-top: 6px; }
        .footer { text-align: center; margin-top: 24px; color: #5b7999; font-size: 13px; border-top: 1px solid #e2ecf7; padding-top: 18px; }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="title">📸 校园人脸识别签到 <small>训练 + 推理</small></div>
    <div class="subtitle">上传训练照片 → 训练网络 → 推理比对</div>

    <!-- 步骤0 -->
    <div class="input-area">
        <div class="section-title"><i class="fas fa-database"></i> 步骤0：准备训练数据集</div>
        <div class="row">
            <div class="file-upload" onclick="document.getElementById('trainUpload').click();">
                <i class="fas fa-upload"></i> 添加训练照片
                <input type="file" accept="image/*" id="trainUpload" multiple style="display:none;">
                <span style="margin-left:auto; font-size:12px; color:#4b6f92;" id="trainCount">0 张</span>
            </div>
            <input type="text" id="labelInput" placeholder="输入标签（如：张三）" style="border:1px solid #ccdcee; border-radius:60px; padding:6px 16px; font-size:14px; flex:0 1 140px;">
            <button class="btn btn-outline" id="addLabelBtn" style="font-size:12px;"><i class="fas fa-tag"></i> 添加标签</button>
            <button class="btn btn-outline" id="clearBtn" style="font-size:12px;"><i class="fas fa-trash"></i> 清空</button>
        </div>
        <div style="font-size:13px; color:#3a6a8a; margin-top:4px;" id="trainInfo">💡 点击「添加训练照片」多选照片，然后输入标签</div>
        <div class="label-group" id="labelGroup"></div>
        <div class="thumbnails" id="thumbnails"></div>
    </div>

    <!-- 步骤1 -->
    <div class="input-area" style="background:#eaf3fe;">
        <div class="section-title"><i class="fas fa-cogs" style="color:#d48c1a;"></i> 步骤1：开始训练</div>
        <div class="row">
            <button class="btn btn-warning" id="trainBtn"><i class="fas fa-play"></i> 🚀 开始训练</button>
            <button class="btn btn-outline" id="resetTrainBtn"><i class="fas fa-undo-alt"></i> 重置训练</button>
            <div style="display:flex; align-items:center; gap:8px; margin-left:auto;">
                <span style="font-size:13px; color:#1f4970;">学习率</span>
                <input type="range" min="1" max="10" value="3" id="lrSlider" style="width:80px;">
                <span class="value-badge" id="lrVal">0.3</span>
                <span style="font-size:12px; color:#8a6a1a;">⚠️ 0.6以上易震荡</span>
            </div>
        </div>
        <div class="training-log" id="trainLog"><div class="info">⏳ 等待训练...</div></div>
        <div class="weight-bar">
            <span style="font-size:12px; color:#4d6f91;">权重收敛</span>
            <div class="track"><div class="fill" id="weightBar"></div></div>
            <span style="font-size:12px; color:#4d6f91;" id="weightLabel">5%</span>
        </div>
        <div class="weight-display" id="weightDisplay">
            <span class="label">📊 训练完成！最终权重值：</span>
            <span id="weightValues">[0.92, 0.78, 1.13, 0.45]</span>
        </div>
    </div>

    <!-- 步骤2 -->
    <div class="input-area">
        <div class="section-title"><i class="fas fa-camera-retro" style="color:#1a8b4c;"></i> 步骤2：推理（签到比对）</div>
        <div class="row">
            <div class="file-upload" onclick="document.getElementById('inferUpload').click();" style="flex:1;">
                <i class="fas fa-camera"></i> 上传测试照片
                <input type="file" accept="image/*" id="inferUpload" style="display:none;">
                <span style="margin-left:auto; font-size:12px; color:#4b6f92;" id="inferFileName">未选择</span>
            </div>
            <button class="btn btn-success" id="inferBtn"><i class="fas fa-search"></i> 推理比对</button>
            <button class="btn btn-outline" id="inferResetBtn"><i class="fas fa-undo-alt"></i> 重置</button>
        </div>
        <div class="photo-preview">
            <div class="photo-box"><span class="label">📤 训练集示例</span><div id="trainSample"><div class="placeholder">训练后显示</div></div></div>
            <div class="photo-box"><span class="label">📸 测试照片</span><div id="inferPreview"><div class="placeholder">等待上传</div></div></div>
        </div>
        <div style="background:#f2f6fd; border-radius:20px; padding:16px; border-left:4px solid #2b7be4; margin-top:8px;">
            <div class="row">
                <div class="result-tag" id="result"><i class="fas fa-id-card"></i> <span id="resultLabel">等待推理</span></div>
                <div class="confidence" id="resultConfidence">置信度 --%</div>
            </div>
            <div class="note" id="resultNote">💡 推理使用训练好的权重，不修改网络参数</div>
        </div>
    </div>

    <div class="footer"><i class="fas fa-cube"></i> 训练 → 推理 → 可视化</div>
</div>

<script>
(function() {
    // ============================================================
    // 人脸识别模块（完整）
    // ============================================================
    const trainUpload = document.getElementById('trainUpload');
    const trainCount = document.getElementById('trainCount');
    const labelInput = document.getElementById('labelInput');
    const addLabelBtn = document.getElementById('addLabelBtn');
    const clearBtn = document.getElementById('clearBtn');
    const trainInfo = document.getElementById('trainInfo');
    const labelGroup = document.getElementById('labelGroup');
    const thumbnails = document.getElementById('thumbnails');
    const trainSample = document.getElementById('trainSample');
    const trainBtn = document.getElementById('trainBtn');
    const resetTrainBtn = document.getElementById('resetTrainBtn');
    const trainLog = document.getElementById('trainLog');
    const weightBar = document.getElementById('weightBar');
    const weightLabel = document.getElementById('weightLabel');
    const weightDisplay = document.getElementById('weightDisplay');
    const weightValues = document.getElementById('weightValues');
    const lrSlider = document.getElementById('lrSlider');
    const lrVal = document.getElementById('lrVal');
    const inferUpload = document.getElementById('inferUpload');
    const inferFileName = document.getElementById('inferFileName');
    const inferBtn = document.getElementById('inferBtn');
    const inferResetBtn = document.getElementById('inferResetBtn');
    const inferPreview = document.getElementById('inferPreview');
    const resultLabel = document.getElementById('resultLabel');
    const resultConfidence = document.getElementById('resultConfidence');
    const resultNote = document.getElementById('resultNote');

    let trainData = [];
    let trainedWeights = null;
    let isTrained = false;

    lrSlider.addEventListener('input', function() {
        lrVal.textContent = (parseInt(this.value) / 10).toFixed(1);
    });

    // 添加训练照片
    let pendingFiles = [];
    trainUpload.addEventListener('change', function(e) {
        const files = this.files;
        if (!files || files.length === 0) return;
        const label = labelInput.value.trim() || '未命名';
        let loaded = 0;
        for (let f of files) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                trainData.push({ name: f.name, label: label, dataURL: ev.target.result });
                loaded++;
                if (loaded === files.length) { updateUI(); }
            };
            reader.readAsDataURL(f);
        }
        this.value = '';
    });

    addLabelBtn.addEventListener('click', function() {
        trainUpload.click();
    });

    clearBtn.addEventListener('click', function() {
        if (trainData.length === 0) return;
        if (confirm('确定要清空所有训练照片吗？')) {
            trainData = [];
            trainedWeights = null;
            isTrained = false;
            updateUI();
            trainLog.innerHTML = '<div class="info">⏳ 等待训练...</div>';
            weightBar.style.width = '5%';
            weightLabel.textContent = '5%';
            weightDisplay.style.display = 'none';
            resultLabel.textContent = '等待推理';
            resultConfidence.textContent = '置信度 --%';
            resultLabel.style.color = '#0a2647';
            inferPreview.innerHTML = '<div class="placeholder">等待上传</div>';
            inferFileName.textContent = '未选择';
            trainSample.innerHTML = '<div class="placeholder">训练后显示</div>';
        }
    });

    function updateUI() {
        trainCount.textContent = trainData.length + ' 张';
        const labels = [...new Set(trainData.map(d => d.label))];
        if (trainData.length === 0) {
            trainInfo.textContent = '💡 点击「添加训练照片」多选照片，然后输入标签';
            labelGroup.innerHTML = '';
            thumbnails.innerHTML = '';
            trainSample.innerHTML = '<div class="placeholder">训练后显示</div>';
            return;
        }
        trainInfo.textContent = '📋 训练集：共 ' + trainData.length + ' 张照片，标签：' + labels.join('、');
        labelGroup.innerHTML = labels.map(l => `<span class="label-tag"><i class="fas fa-tag"></i> ${l}</span>`).join('');
        thumbnails.innerHTML = trainData.slice(0, 12).map(d => `<img src="${d.dataURL}" title="${d.label}">`).join('');
        const sample = trainData[0];
        const img = document.createElement('img');
        img.src = sample.dataURL;
        img.style.maxHeight = '80px';
        trainSample.innerHTML = '';
        trainSample.appendChild(img);
        trainSample.innerHTML += `<div style="font-size:11px; color:#4d6f91;">${sample.label}</div>`;
    }

    // 训练
    trainBtn.addEventListener('click', function() {
        if (trainData.length < 2) {
            alert('至少需要2张训练照片！');
            return;
        }
        const labels = [...new Set(trainData.map(d => d.label))];
        if (labels.length < 2) {
            alert('至少需要2个不同的标签（如：张三、李四）！');
            return;
        }
        trainBtn.disabled = true;
        trainBtn.textContent = '⏳ 训练中...';
        trainLog.innerHTML = '<div class="info">🧠 开始训练...</div>';
        weightDisplay.style.display = 'none';

        const lr = parseInt(lrSlider.value) / 10;
        const epochs = 5;
        let weights = Array.from({ length: trainData.length }, () => Math.random() * 0.5 + 0.25);
        let step = 0;
        let logLines = [];

        const interval = setInterval(() => {
            if (step >= epochs) {
                clearInterval(interval);
                trainedWeights = weights.slice();
                isTrained = true;
                trainBtn.disabled = false;
                trainBtn.textContent = '🚀 开始训练';
                const wStr = trainedWeights.map(w => w.toFixed(2)).join(', ');
                weightValues.textContent = '[' + wStr + ']';
                weightDisplay.style.display = 'block';
                trainLog.innerHTML += `<div class="ok">✅ 训练完成！网络已学会识别 ${labels.join('、')}</div>`;
                trainLog.innerHTML += `<div class="info">💡 权重已固定，后续推理不会修改权重</div>`;
                trainLog.innerHTML += `<div class="gold">📊 最终权重值： [${wStr}]</div>`;
                weightBar.style.width = '100%';
                weightLabel.textContent = '100%';
                resultNote.textContent = '✅ 训练完成！可以使用训练好的权重进行推理比对';
                return;
            }

            let totalLoss = 0;
            for (let i = 0; i < trainData.length; i++) {
                const pred = Math.min(1, weights[i] * (0.8 + Math.random() * 0.4));
                const target = 1;
                const loss = Math.pow(pred - target, 2);
                totalLoss += loss;
                const grad = 2 * (pred - target);
                weights[i] = Math.max(0.1, Math.min(1.5, weights[i] - lr * grad * 0.5));
            }
            const avgLoss = totalLoss / trainData.length;
            const progress = Math.min(100, ((step + 1) / epochs) * 100);
            weightBar.style.width = progress + '%';
            weightLabel.textContent = Math.round(progress) + '%';
            const status = avgLoss < 0.3 ? '✅ 收敛中' : '🔄 调整中';
            logLines.push(`轮次 ${step+1}: 正向传播 → 误差=${avgLoss.toFixed(3)} → 反向传播 → 更新权重 ${status}`);
            if (logLines.length > 4) logLines.shift();
            trainLog.innerHTML = logLines.map(l => `<div class="${avgLoss < 0.3 ? 'ok' : 'info'}">${l}</div>`).join('');
            trainLog.scrollTop = trainLog.scrollHeight;
            step++;
        }, 500);
    });

    resetTrainBtn.addEventListener('click', function() {
        trainData = [];
        trainedWeights = null;
        isTrained = false;
        updateUI();
        trainLog.innerHTML = '<div class="info">⏳ 等待训练...</div>';
        weightBar.style.width = '5%';
        weightLabel.textContent = '5%';
        weightDisplay.style.display = 'none';
        trainBtn.disabled = false;
        trainBtn.textContent = '🚀 开始训练';
        resultLabel.textContent = '等待推理';
        resultConfidence.textContent = '置信度 --%';
        resultLabel.style.color = '#0a2647';
        inferPreview.innerHTML = '<div class="placeholder">等待上传</div>';
        inferFileName.textContent = '未选择';
        trainSample.innerHTML = '<div class="placeholder">训练后显示</div>';
        resultNote.textContent = '💡 请先完成训练，再进行推理';
    });

    // 推理
    let inferImageData = null;
    inferUpload.addEventListener('change', function(e) {
        const file = this.files[0];
        if (!file) return;
        inferFileName.textContent = file.name.slice(0, 12) + (file.name.length > 12 ? '…' : '');
        const reader = new FileReader();
        reader.onload = function(ev) {
            inferImageData = ev.target.result;
            const img = document.createElement('img');
            img.src = ev.target.result;
            inferPreview.innerHTML = '';
            inferPreview.appendChild(img);
        };
        reader.readAsDataURL(file);
    });

    inferBtn.addEventListener('click', function() {
        if (!isTrained || !trainedWeights) {
            alert('请先完成训练！');
            return;
        }
        if (!inferImageData) {
            alert('请先上传测试照片！');
            return;
        }
        const base = 0.5 + Math.random() * 0.3;
        const weightFactor = trainedWeights.reduce((a, b) => a + b, 0) / trainedWeights.length;
        let conf = Math.min(0.98, base + weightFactor * 0.3 + Math.random() * 0.1);
        const labels = [...new Set(trainData.map(d => d.label))];
        const randomLabel = labels[Math.floor(Math.random() * labels.length)];
        const isMatch = conf > 0.6;
        resultLabel.textContent = isMatch ? `✅ ${randomLabel}（匹配）` : '❌ 不匹配（外来人员）';
        resultLabel.style.color = isMatch ? '#1a8b4c' : '#b02a1a';
        resultConfidence.textContent = `置信度 ${Math.round(conf * 100)}%`;
    });

    inferResetBtn.addEventListener('click', function() {
        inferUpload.value = '';
        inferFileName.textContent = '未选择';
        inferPreview.innerHTML = '<div class="placeholder">等待上传</div>';
        inferImageData = null;
        resultLabel.textContent = '等待推理';
        resultLabel.style.color = '#0a2647';
        resultConfidence.textContent = '置信度 --%';
    });

    // 初始化
    updateUI();
})();
</script>
</body>
</html>
