<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神经网络实验平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #f0f4fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; width: 100%; background: white; border-radius: 48px; box-shadow: 0 20px 60px rgba(0,20,40,0.12); padding: 48px 40px; text-align: center; }
        .logo { font-size: 64px; margin-bottom: 12px; }
        h1 { font-size: 32px; color: #0a2647; margin-bottom: 8px; }
        .sub { color: #5f7d9c; font-size: 16px; margin-bottom: 32px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        .card { background: #f8fafc; border-radius: 20px; padding: 30px 20px; border: 2px solid #e9f0f7; text-decoration: none; color: #0a2647; transition: 0.2s; }
        .card:hover { border-color: #2b7be4; transform: translateY(-4px); box-shadow: 0 12px 30px rgba(43,123,228,0.12); }
        .card .icon { font-size: 40px; margin-bottom: 12px; }
        .card h3 { font-size: 18px; margin-bottom: 6px; }
        .card p { font-size: 14px; color: #5f7d9c; }
        .badge { display: inline-block; background: #d4e2fc; color: #1a4c8a; padding: 2px 12px; border-radius: 30px; font-size: 12px; margin-top: 8px; }
        .footer { margin-top: 32px; color: #a0b8d0; font-size: 13px; border-top: 1px solid #eef3f8; padding-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">🧠</div>
    <h1>神经网络实验平台</h1>
    <p class="sub">选择下面一个案例开始体验</p>

    <div class="grid">
        <a href="face.html" class="card">
            <div class="icon">📸</div>
            <h3>校园人脸识别签到</h3>
            <p>上传照片 → 训练 → 推理比对</p>
            <span class="badge">图像分类</span>
        </a>
        <a href="rec.html" class="card">
            <div class="icon">🎬</div>
            <h3>短视频个性化推荐</h3>
            <p>选视频 → 训练 → 兴趣提取 → 推荐排序</p>
            <span class="badge">内容推荐</span>
        </a>
    </div>

    <div class="footer">训练 · 推理 · 可视化</div>
</div>
</body>
</html>
