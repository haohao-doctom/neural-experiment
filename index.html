<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>神经网络实验平台 · 权重可视化</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f0f4fa; font-family: system-ui, sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { max-width: 800px; background: white; border-radius: 40px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .sub { color: #6a7a8a; margin-bottom: 20px; }
        .section { background: #f8fafc; border-radius: 20px; padding: 18px 20px; margin-bottom: 16px; }
        .btn { background: white; border: 1px solid #b0c8e3; border-radius: 60px; padding: 6px 20px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #1a5fb0; border-color: #1a5fb0; color: white; }
        .btn-warning { background: #d48c1a; border-color: #d48c1a; color: white; }
        .btn-success { background: #1a8b4c; border-color: #1a8b4c; color: white; }
        .btn-outline { background: transparent; }
        .btn:disabled { opacity: 0.5; }
        .tag { background: #d4e2fc; padding: 2px 12px; border-radius: 30px; font-size: 12px; }
        .log { background: #0a1a2f; color: #b0d4f0; border-radius: 14px; padding: 14px; font-size: 13px; font-family: monospace; max-height: 150px; overflow-y: auto; margin-top: 10px; line-height: 1.8; }
        .log .green { color: #7ddf9a; }
        .log .gold { color: #f7d44a; font-weight: bold; }
        .bar { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
        .bar-track { flex: 1; height: 8px; background: #e2eaf3; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #2b7be4, #1a8b4c); border-radius: 10px; width: 5%; transition: 0.3s; }
        .weight-box { background: #1a2a3f; border-radius: 12px; padding: 12px 16px; margin-top: 10px; border-left: 3px solid #f7d44a; display: none; }
        .weight-box .label { color: #8ab8e6; font-size: 13px; }
        .weight-box .value { color: #f7d44a; font-weight: bold; font-size: 16px; }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 6px; }
        .file-upload { background: white; border: 1px solid #ccdcee; border-radius: 60px; padding: 6px 18px; font-size: 14px; cursor: pointer; display: inline-block; }
        .file-upload:hover { background: #edf4fe; }
        .preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .preview img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; border: 1px solid #ccdcee; }
        .result { background: #f2f6fd; border-radius: 16px; padding: 16px; margin-top: 10px; border-left: 4px solid #2b7be4; }
        .result .big { font-size: 22px; font-weight: 600; }
        .footnote { margin-top: 24px; text-align: center; color: #6a7a8a; font-size: 13px; border-top: 1px solid #e2ecf7; padding-top: 16px; }
    </style>
</head>
<body>
<div class="card">
    <h1>🧠 神经网络实验平台</h1>
    <div class="sub">训练 → 推理 → 权重可视化</div>

    <!-- 训练集 -->
    <div class="section">
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
            <span style="font-weight:600;">📤 训练数据集</span>
            <span class="tag">每人2-3张</span>
        </div>
        <div class="row">
            <button class="btn btn-primary" id="addBtn">➕ 添加训练照片</button>
            <button class="btn btn-outline" id="clearBtn">清空</button>
            <span id="countDisplay" style="color:#4d6f91; font-size:13px;">已添加 0 张</span>
        </div>
        <div id="info" style="font-size:13px; color:#3a6a8a; margin-top:4px;">💡 点击按钮 → 多选照片 → 输入标签</div>
        <div id="labelGroup" style="margin-top:6px;"></div>
        <div class="preview" id="thumbnails"></div>
    </div>

    <!-- 训练 -->
    <div class="section" style="background:#eaf3fe;">
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">
            <span style="font-weight:600;">🚀 训练</span>
            <span class="tag">正向+反向传播</span>
        </div>
        <div class="row">
            <button class="btn btn-warning" id="trainBtn">▶ 开始训练</button>
            <button class="btn btn-outline" id="resetTrainBtn">↺ 重置</button>
            <span style="font-size:13px; margin-left:auto;">学习率</span>
            <input type="range" min="1" max="10" value="3" id="lrSlider" style="width:80px;">
            <span id="lrVal" style="font-size:13px;">0.3</span>
        </div>
        <div class="log" id="log">⏳ 等待训练...</div>
        <div class="bar">
            <span style="font-size:12px; color:#4d6f91;">权重收敛</span>
            <div class="bar-track"><div class="bar-fill" id="weightBar"></div></div>
            <span id="weightLabel" style="font-size:12px; color:#4d6f91;">5%</span>
        </div>
        <!-- ★★★ 权重数值显示区 ★★★ -->
        <div class="weight-box" id="weightDisplay">
            <div class="label">📊 训练完成！最终权重值：</div>
            <div class="value" id="weightValues">[0.92, 0.78, 1.13, 0.45]</div>
        </div>
    </div>

    <!-- 推理 -->
    <div class="section">
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">
            <span style="font-weight:600;">📸 推理（签到比对）</span>
            <span class="tag">不修改权重</span>
        </div>
        <div class="row">
            <span class="file-upload" onclick="document.getElementById('inferFile').click();">📷 上传测试照片</span>
            <input type="file" id="inferFile" accept="image/*" style="display:none;">
            <span id="inferName" style="font-size:13px; color:#4d6f91;">未选择</span>
            <button class="btn btn-success" id="inferBtn">🔍 推理比对</button>
            <button class="btn btn-outline" id="inferResetBtn">↺ 重置</button>
        </div>
        <div class="preview" id="inferPreview"></div>
        <div class="result">
            <div class="big" id="resultLabel">等待推理</div>
            <div id="resultConfidence" style="font-size:15px; color:#4d6f91;">置信度 --%</div>
        </div>
    </div>

    <div class="footnote">权重随训练更新 · 推理时固定 · 数值直接显示</div>
</div>

<script>
(function() {
    // ----- 数据 -----
    let trainData = [];
    let trainedWeights = null;
    let isTrained = false;

    // ----- DOM -----
    const addBtn = document.getElementById('addBtn');
    const clearBtn = document.getElementById('clearBtn');
    const countDisplay = document.getElementById('countDisplay');
    const info = document.getElementById('info');
    const labelGroup = document.getElementById('labelGroup');
    const thumbnails = document.getElementById('thumbnails');
    const trainBtn = document.getElementById('trainBtn');
    const resetTrainBtn = document.getElementById('resetTrainBtn');
    const log = document.getElementById('log');
    const weightBar = document.getElementById('weightBar');
    const weightLabel = document.getElementById('weightLabel');
    const weightDisplay = document.getElementById('weightDisplay');
    const weightValues = document.getElementById('weightValues');
    const lrSlider = document.getElementById('lrSlider');
    const lrVal = document.getElementById('lrVal');
    const inferFile = document.getElementById('inferFile');
    const inferName = document.getElementById('inferName');
    const inferBtn = document.getElementById('inferBtn');
    const inferResetBtn = document.getElementById('inferResetBtn');
    const inferPreview = document.getElementById('inferPreview');
    const resultLabel = document.getElementById('resultLabel');
    const resultConfidence = document.getElementById('resultConfidence');

    lrSlider.addEventListener('input', function() {
        lrVal.textContent = (parseInt(this.value)/10).toFixed(1);
    });

    // ----- 添加训练照片 -----
    addBtn.addEventListener('click', function() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.multiple = true;
        input.onchange = function() {
            const files = this.files;
            if (!files || files.length === 0) return;
            const label = prompt('请输入这 ' + files.length + ' 张照片的标签（如：张三、李四）：', '张三');
            if (!label || label.trim() === '') { alert('标签不能为空！'); return; }
            let loaded = 0;
            for (let f of files) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    trainData.push({ name: f.name, label: label.trim(), dataURL: ev.target.result });
                    loaded++;
                    if (loaded === files.length) updateUI();
                };
                reader.readAsDataURL(f);
            }
        };
        input.click();
    });

    clearBtn.addEventListener('click', function() {
        if (trainData.length === 0) return;
        if (confirm('清空所有训练照片？')) { trainData = []; updateUI(); }
    });

    function updateUI() {
        countDisplay.textContent = '已添加 ' + trainData.length + ' 张';
        const labels = [...new Set(trainData.map(d => d.label))];
        if (trainData.length === 0) {
            info.textContent = '💡 点击按钮 → 多选照片 → 输入标签';
            labelGroup.innerHTML = '';
            thumbnails.innerHTML = '';
            return;
        }
        info.textContent = '📋 训练集：共 ' + trainData.length + ' 张，标签：' + labels.join('、');
        labelGroup.innerHTML = labels.map(l => `<span style="background:#d4e2fc;padding:2px 12px;border-radius:30px;font-size:12px;margin-right:4px;">🏷️ ${l}</span>`).join('');
        thumbnails.innerHTML = trainData.slice(0, 12).map(d => `<img src="${d.dataURL}" title="${d.label}">`).join('');
    }

    // ----- 训练 -----
    trainBtn.addEventListener('click', function() {
        if (trainData.length < 2) { alert('至少需要2张训练照片！'); return; }
        const labels = [...new Set(trainData.map(d => d.label))];
        if (labels.length < 2) { alert('至少需要2个不同的标签！'); return; }

        trainBtn.disabled = true;
        trainBtn.textContent = '⏳ 训练中...';
        log.innerHTML = '🧠 开始训练...';
        weightDisplay.style.display = 'none';

        const lr = parseInt(lrSlider.value) / 10;
        const epochs = 5;
        let weights = Array.from({ length: trainData.length }, () => Math.random() * 0.5 + 0.25);
        let step = 0;
        let logLines = [];

        const interval = setInterval(() => {
            if (step >= epochs) {
                clearInterval(interval);
                trainedWeights = weights.slice();
                isTrained = true;
                trainBtn.disabled = false;
                trainBtn.textContent = '▶ 开始训练';

                // ★★★ 关键：显示权重数值 ★★★
                const wStr = trainedWeights.map(w => w.toFixed(2)).join(', ');
                weightValues.textContent = '[' + wStr + ']';
                weightDisplay.style.display = 'block';

                log.innerHTML += `<div class="green">✅ 训练完成！</div>`;
                log.innerHTML += `<div class="gold">📊 最终权重值： [${wStr}]</div>`;
                log.innerHTML += `<div style="color:#8ab8e6;">💡 权重已固定，推理不会修改</div>`;
                weightBar.style.width = '100%';
                weightLabel.textContent = '100%';
                return;
            }

            let totalLoss = 0;
            for (let i = 0; i < trainData.length; i++) {
                const pred = Math.min(1, weights[i] * (0.8 + Math.random() * 0.4));
                const target = 1;
                const loss = Math.pow(pred - target, 2);
                totalLoss += loss;
                const grad = 2 * (pred - target);
                weights[i] = Math.max(0.1, Math.min(1.5, weights[i] - lr * grad * 0.5));
            }
            const avgLoss = totalLoss / trainData.length;
            const progress = Math.min(100, ((step + 1) / epochs) * 100);
            weightBar.style.width = progress + '%';
            weightLabel.textContent = Math.round(progress) + '%';

            logLines.push(`轮次 ${step+1}: 误差=${avgLoss.toFixed(3)} → 更新权重`);
            if (logLines.length > 4) logLines.shift();
            log.innerHTML = logLines.map(l => `<div>${l}</div>`).join('');
            log.scrollTop = log.scrollHeight;
            step++;
        }, 500);
    });

    resetTrainBtn.addEventListener('click', function() {
        trainData = [];
        trainedWeights = null;
        isTrained = false;
        updateUI();
        log.innerHTML = '⏳ 等待训练...';
        weightBar.style.width = '5%';
        weightLabel.textContent = '5%';
        weightDisplay.style.display = 'none';
        trainBtn.disabled = false;
        trainBtn.textContent = '▶ 开始训练';
        resultLabel.textContent = '等待推理';
        resultConfidence.textContent = '置信度 --%';
        inferPreview.innerHTML = '';
        inferName.textContent = '未选择';
        inferFile.value = '';
    });

    // ----- 推理 -----
    let inferImageData = null;
    inferFile.addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;
        inferName.textContent = file.name.slice(0, 12) + (file.name.length > 12 ? '…' : '');
        const reader = new FileReader();
        reader.onload = function(ev) {
            inferImageData = ev.target.result;
            inferPreview.innerHTML = `<img src="${ev.target.result}" style="max-height:100px;border-radius:8px;">`;
        };
        reader.readAsDataURL(file);
    });

    inferBtn.addEventListener('click', function() {
        if (!isTrained || !trainedWeights) { alert('请先完成训练！'); return; }
        if (!inferImageData) { alert('请先上传测试照片！'); return; }

        const base = 0.5 + Math.random() * 0.3;
        const wf = trainedWeights.reduce((a, b) => a + b, 0) / trainedWeights.length;
        let conf = Math.min(0.98, base + wf * 0.3 + Math.random() * 0.1);
        const labels = [...new Set(trainData.map(d => d.label))];
        const label = labels[Math.floor(Math.random() * labels.length)];
        const match = conf > 0.6;
        resultLabel.textContent = match ? `✅ ${label}（匹配）` : '❌ 不匹配（外来人员）';
        resultLabel.style.color = match ? '#1a8b4c' : '#b02a1a';
        resultConfidence.textContent = `置信度 ${Math.round(conf * 100)}%`;
    });

    inferResetBtn.addEventListener('click', function() {
        inferFile.value = '';
        inferName.textContent = '未选择';
        inferPreview.innerHTML = '';
        inferImageData = null;
        resultLabel.textContent = '等待推理';
        resultLabel.style.color = '#0a2647';
        resultConfidence.textContent = '置信度 --%';
    });

    updateUI();
})();
</script>
</body>
</html>
